<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Contact | TechNova Solutions</title>

    <meta
        name="description"
        content="Contact TechNova Solutions for web development, mobile apps, custom software and cloud solutions.">

    <link rel="stylesheet" href="style1s.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="container">

            <h1>TechNova Solutions</h1>

            <p>Let's Build Something Amazing Together</p>

            <button id="theme-toggle" aria-label="Toggle Dark Mode">
                🌙
            </button>

        </div>
    </header>


    <!-- NAVIGATION -->
    <nav class="navbar">

        <h2 class="logo">TechNova</h2>

        <button
            class="menu-toggle"
            id="menu-toggle"
            aria-label="Open Menu">
            ☰
        </button>

        <div class="nav-links" id="nav-links">

            <a href="web.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="projects.html">Projects</a>
            <a href="testimonials.html">Testimonials</a>
            <a href="contact.html">Contact</a>

        </div>

    </nav>


    <!-- CONTACT SECTION -->
    <main>

        <section class="contact-section">

            <div class="container">

                <h2>Contact Us</h2>

                <p class="section-intro">
                    Have a project in mind? Send us a message
                    and our team will get back to you.
                </p>


                <!-- CONTACT FORM -->
                <form
                    id="contact-form"
                    action="https://formspree.io/f/xwlezqaa"
                    method="POST">

                    <!-- NAME -->
                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your name"
                            autocomplete="name"
                            required>

                    </div>


                    <!-- EMAIL -->
                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>

                    </div>


                    <!-- PHONE -->
                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            autocomplete="tel">

                    </div>


                    <!-- SERVICE -->
                    <div class="form-group">

                        <label for="service">
                            Select Service
                        </label>

                        <select
                            id="service"
                            name="service"
                            required>

                            <option value="">
                                -- Select a Service --
                            </option>

                            <option value="web-development">
                                Web Development
                            </option>

                            <option value="mobile-app">
                                Mobile App Development
                            </option>

                            <option value="custom-software">
                                Custom Software
                            </option>

                            <option value="cloud-solutions">
                                Cloud Solutions
                            </option>

                            <option value="ui-ux">
                                UI/UX Design
                            </option>

                        </select>

                    </div>


                    <!-- MESSAGE -->
                    <div class="form-group">

                        <label for="message">
                            Your Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            placeholder="Tell us about your project..."
                            required></textarea>

                    </div>


                    <!-- SUBMIT -->
                    <button
                        type="submit"
                        class="btn">

                        Send Message

                    </button>

                </form>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

        <p>
            © <span id="current-year"></span>
            TechNova Solutions. All Rights Reserved.
        </p>

    </footer>


    <!-- BACK TO TOP -->
    <button
        id="back-to-top"
        aria-label="Back to top">

        ↑

    </button>


    <!-- JAVASCRIPT -->
    <script src="script1.js"></script>

</body>

</html>
